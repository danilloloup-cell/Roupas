<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho — Eterna Moda</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">EM</span> <span class="brand-name">Eterna Moda</span></a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="catalogo.html">Produtos</a></li>
          <li><a href="carrinho.html" class="active">Carrinho</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding:24px 0">
    <h2>Carrinho de compras</h2>
    <div id="cartBodyPage" class="cart-body"></div>
    <div style="margin-top:20px;display:flex;justify-content:space-between;align-items:center">
      <div class="small">Total: <strong id="cartTotalPage">R$ 0,00</strong></div>
      <button id="checkoutBtnPage" class="btn-cta">Finalizar Compra</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <strong>Eterna Moda</strong><br>
        <small>© <span id="year"></span> Todos os direitos reservados.</small>
      </div>
      <div class="footer-links">
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
        <a href="catalogo.html">Produtos</a>
      </div>
    </div>
  </footer>

  <script>
    // Reaproveitando funções do script.js
    function updateCartPage(){
      const container = document.getElementById('cartBodyPage');
      container.innerHTML = '';
      state.cart.forEach((it, idx)=>{
        const p = findProduct(it.id); if(!p) return;
        const div = document.createElement('div'); div.className='cart-item';
        div.innerHTML = `<img src="${p.imgs[0]}" alt="${p.title}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;margin-right:8px;">
          <div style="flex:1">
            <strong>${p.title}</strong>
            <div class="small">${it.selectedSize ? 'Tamanho '+it.selectedSize : ''}</div>
            <div class="small">${formatBRL(p.price)} x ${it.qty}</div>
            <div style="display:flex;gap:6px;margin-top:6px">
              <button class="btn-ghost" onclick="changeQtyIndex(${idx},-1)">-</button>
              <button class="btn-ghost" onclick="changeQtyIndex(${idx},1)">+</button>
              <button class="btn-ghost" onclick="removeCartIndex(${idx})">Remover</button>
            </div>
          </div>`;
        container.appendChild(div);
      });
      document.getElementById('cartTotalPage').textContent = formatBRL(cartValue());
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      updateCartPage();
      document.getElementById('checkoutBtnPage').addEventListener('click', async ()=>{
        if(state.cart.length===0){toast('Carrinho vazio');return;}
        const btn = document.getElementById('checkoutBtnPage');
        btn.disabled=true; btn.textContent='Processando...';
        await new Promise(r=>setTimeout(r,1000));
        state.cart=[]; persistCart(); updateCartPage();
        btn.disabled=false; btn.textContent='Finalizar Compra';
        toast('Compra simulada concluída — carrinho limpo');
      });
    });
  </script>
</body>
</html>
