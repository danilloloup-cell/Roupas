<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Eterna Moda</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">EM</span> <span class="brand-name">Eterna Moda</span></a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="catalogo.html">Produtos</a></li>
          <li><a href="carrinho.html">Carrinho</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap" style="display:flex;justify-content:center;align-items:center;min-height:70vh">
    <div style="background:var(--panel);padding:24px;border-radius:12px;max-width:360px;width:100%;box-shadow:var(--shadow)">
      <h2 style="margin-top:0">Entrar na sua conta</h2>
      <form id="loginForm">
        <label>Email<br>
          <input type="email" placeholder="seuemail@dominio.com" required style="width:100%;padding:10px;border-radius:8px;margin:6px 0">
        </label>
        <label>Senha<br>
          <input type="password" placeholder="••••••" required style="width:100%;padding:10px;border-radius:8px;margin:6px 0">
        </label>
        <button class="btn-cta" style="width:100%;margin-top:12px">Entrar</button>
      </form>
      <p style="text-align:center;margin-top:12px"><a href="index.html" class="link-muted">Voltar à loja</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <strong>Eterna Moda</strong><br>
        <small>© <span id="year"></span> Todos os direitos reservados.</small>
      </div>
      <div class="footer-links">
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
        <a href="catalogo.html">Produtos</a>
      </div>
    </div>
  </footer>
</body>
</html>
